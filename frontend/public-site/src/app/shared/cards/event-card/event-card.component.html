<article class="event-card">
  <!-- Date badge -->
  <div class="event-card__date" aria-hidden="true">
    <span class="event-card__month">{{ monthLabel() }}</span>
    <span class="event-card__day">{{ dayLabel() }}</span>
  </div>

  <!-- Content -->
  <div class="event-card__content">
    <div class="event-card__meta">
      @for (tag of event().tags ?? []; track tag.label) {
        <app-badge type="event-tag" [value]="tag.label" [color]="tag.color" />
      }
      @if (event().time) {
        <span class="event-card__time">
          <i class="pi pi-clock" aria-hidden="true"></i>
          {{ event().time }}
        </span>
      }
    </div>

    <h3 class="event-card__title">{{ event().title }}</h3>

    <p class="event-card__location">
      <i class="pi pi-map-marker" aria-hidden="true"></i>
      {{ event().location }}
    </p>

    <p class="event-card__desc">{{ event().description }}</p>
  </div>
</article>
