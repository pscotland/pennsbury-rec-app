<div class="form-field" [class.form-field--error]="!!errorMessage()">
  <label class="form-field__label" [for]="fieldId()">
    {{ label() }}
    @if (required()) {
      <span class="form-field__required" aria-hidden="true">*</span>
    }
    @if (optional()) {
      <span class="form-field__optional">(optional)</span>
    }
  </label>

  <ng-content />

  @if (errorMessage()) {
    <div
      class="form-field__error"
      role="alert"
      aria-live="polite"
    >
      <i class="pi pi-exclamation-circle" aria-hidden="true"></i>
      {{ errorMessage() }}
    </div>
  }
</div>
