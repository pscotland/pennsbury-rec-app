<div class="checkbox-wrap">
  <p-checkbox
    [inputId]="checkboxId() ?? ('checkbox-' + label().trim().toLowerCase().replace(/\s+/g, '-'))"
    [binary]="true"
    [ngModel]="checked()"
    [disabled]="isDisabled()"
    (ngModelChange)="handleChange($event)"
    styleClass="app-checkbox"
  />
  <label [for]="checkboxId() ?? 'checkbox-' + label()" class="checkbox-label">
    {{ label() }}
  </label>
</div>
