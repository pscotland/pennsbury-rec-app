<p-drawer
  id="public-mobile-nav-drawer"
  position="right"
  [visible]="open()"
  [dismissible]="true"
  [modal]="true"
  [blockScroll]="true"
  (visibleChange)="onDrawerVisibleChange($event)"
  header="Navigation"
  styleClass="w-full max-w-80"
>
  <nav aria-label="Mobile primary navigation" class="mobile-nav">
    <ul class="mobile-nav__list">
      @for (item of links(); track item.label) {
        <li>
          <a
            [routerLink]="item.commands"
            routerLinkActive="mobile-nav__link--active"
            [routerLinkActiveOptions]="{ exact: item.exact ?? false }"
            class="mobile-nav__link"
            (click)="closeDrawer()"
          >
            {{ item.label }}
          </a>
        </li>
      }
    </ul>

    <div class="mobile-nav__actions">
      <p-button
        label="Register"
        [routerLink]="registerCommands()"
        styleClass="mobile-nav__register-button w-full"
        (onClick)="closeDrawer()"
      ></p-button>

      <a
        [routerLink]="adminLoginCommands()"
        class="mobile-nav__secondary-link"
        (click)="closeDrawer()"
      >
        Admin Login
      </a>
    </div>
  </nav>
</p-drawer>
