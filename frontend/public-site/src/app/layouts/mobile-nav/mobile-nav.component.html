<p-drawer
  id="public-mobile-nav-drawer"
  position="right"
  [visible]="open()"
  [dismissible]="true"
  [modal]="true"
  [blockScroll]="true"
  (visibleChange)="onDrawerVisibleChange($event)"
  header="Navigation"
  styleClass="w-full max-w-80"
>
  <nav aria-label="Mobile primary navigation" class="pt-2">
    <ul class="m-0 list-none p-0">
      @for (item of links(); track item.label) {
        <li>
          <a
            [routerLink]="item.commands"
            routerLinkActive="bg-surface-muted text-primary-hover"
            [routerLinkActiveOptions]="{ exact: item.exact ?? false }"
            class="block rounded-lg px-3 py-3 text-base font-medium text-[var(--color-text-primary)] no-underline transition-colors hover:bg-slate-100"
            (click)="closeDrawer()"
          >
            {{ item.label }}
          </a>
        </li>
      }
    </ul>

    <div class="mt-6 flex flex-col gap-3">
      <a
        [routerLink]="registerCommands()"
        class="inline-flex w-full items-center justify-center rounded-lg bg-primary px-4 py-2.5 text-sm font-semibold text-primary-contrast no-underline transition-colors hover:bg-primary-hover focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary focus-visible:ring-offset-2"
        (click)="closeDrawer()"
      >
        Register
      </a>

      <a
        [routerLink]="adminLoginCommands()"
        class="inline-flex items-center justify-center rounded-lg border border-[var(--color-border)] px-4 py-2.5 text-sm font-semibold text-[var(--color-text-primary)] no-underline transition-colors hover:bg-slate-50"
        (click)="closeDrawer()"
      >
        Admin Login
      </a>
    </div>
  </nav>
</p-drawer>
