<header class="site-header">
  <a href="#main-content" class="skip-link">
    Skip to main content
  </a>

  <div class="header-shell">
    <a
      [routerLink]="['/']"
      class="site-logo"
      aria-label="Parks and Recreation Council home"
    >
      <span class="site-logo__badge" aria-hidden="true">
        <i class="pi pi-users text-sm"></i>
      </span>
      <span class="leading-tight">
        <span class="block text-sm font-extrabold tracking-tight">Riverside</span>
        <span class="site-logo__subtitle">
          Recreation Council
        </span>
      </span>
    </a>

    <nav aria-label="Primary navigation" class="primary-nav">
      <p-menubar [model]="desktopMenuItems" styleClass="primary-menubar">
        <ng-template #item let-item>
          <a
            pRipple
            [routerLink]="item.routerLink"
            routerLinkActive="primary-nav__link--active"
            [routerLinkActiveOptions]="{ exact: item.exact ?? false }"
            class="primary-nav__link"
          >
            <span>{{ item.label }}</span>
          </a>
        </ng-template>
      </p-menubar>
    </nav>

    <div class="desktop-actions">
      <a [routerLink]="adminLoginCommands" class="admin-link">
        Admin Login
      </a>

      <p-button label="Register" [routerLink]="registerCommands" size="small" styleClass="register-button"></p-button>
    </div>

    <div class="mobile-nav">
      <p-menu #mobileMenu [model]="menuItems" [popup]="true" styleClass="mobile-menu-popup">
        <ng-template #item let-item>
          <a
            pRipple
            [routerLink]="item.routerLink"
            routerLinkActive="mobile-menu__link--active"
            [routerLinkActiveOptions]="{ exact: item.exact ?? false }"
            class="mobile-menu__link"
            (click)="mobileMenu.hide()"
          >
            @if (item.icon) {
              <i [class]="item.icon" aria-hidden="true"></i>
            }
            <span>{{ item.label }}</span>
          </a>
        </ng-template>
      </p-menu>

      <p-button
        icon="pi pi-bars"
        [text]="true"
        styleClass="menu-button"
        ariaLabel="Open navigation menu"
        (onClick)="mobileMenu.toggle($event)"
      ></p-button>
    </div>
  </div>
</header>
