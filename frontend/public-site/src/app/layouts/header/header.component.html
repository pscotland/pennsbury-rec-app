<header class="sticky top-0 z-50 border-b border-[var(--color-border)] bg-white/95 backdrop-blur supports-[backdrop-filter]:bg-white/85">
  <a
    href="#main-content"
    class="sr-only focus:not-sr-only focus:absolute focus:left-4 focus:top-4 focus:rounded-md focus:bg-white focus:px-3 focus:py-2 focus:text-sm focus:font-semibold"
  >
    Skip to main content
  </a>

  <div class="mx-auto flex h-16 w-full max-w-[var(--container-width)] items-center px-4 sm:px-6 lg:px-8">
    <a
      [routerLink]="['/']"
      class="flex items-center gap-3 rounded-md text-[var(--color-text-primary)] no-underline"
      aria-label="Parks and Recreation Council home"
    >
      <span
        class="ui-brand-badge"
        aria-hidden="true"
      >
        <i class="pi pi-users text-sm"></i>
      </span>
      <span class="leading-tight">
        <span class="block text-sm font-extrabold tracking-tight">Riverside</span>
        <span class="block text-[0.625rem] uppercase tracking-[0.18em] text-[var(--color-text-secondary)]">
          Recreation Council
        </span>
      </span>
    </a>

    <nav aria-label="Primary" class="mx-auto hidden md:block">
      <ul class="m-0 flex list-none items-center gap-1 p-0">
        @for (item of primaryNav; track item.label) {
          <li>
            <a
              [routerLink]="item.commands"
              routerLinkActive="ui-nav-link-active"
              [routerLinkActiveOptions]="{ exact: item.exact ?? false }"
              class="ui-nav-link"
            >
              {{ item.label }}
            </a>
          </li>
        }
      </ul>
    </nav>

    <div class="hidden items-center gap-4 md:flex">
      <a
        [routerLink]="adminLoginCommands"
        class="ui-admin-link"
      >
        Admin Login
      </a>

      <a
        [routerLink]="registerCommands"
        class="ui-cta-link"
      >
        Register
      </a>
    </div>

    <button
      type="button"
      class="ui-icon-button ml-auto md:hidden"
      aria-label="Open mobile navigation"
      [attr.aria-expanded]="mobileNavOpen()"
      aria-controls="public-mobile-nav-drawer"
      (click)="toggleMobileNav()"
    >
      <i class="pi text-base" [class.pi-bars]="!mobileNavOpen()" [class.pi-times]="mobileNavOpen()" aria-hidden="true"></i>
    </button>
  </div>

  <div class="md:hidden">
    <app-mobile-nav
      [open]="mobileNavOpen()"
      [links]="primaryNav"
      [registerCommands]="registerCommands"
      [adminLoginCommands]="adminLoginCommands"
      (openChange)="updateMobileNavState($event)"
    ></app-mobile-nav>
  </div>
</header>
