<header class="site-header">
  <a href="#main-content" class="skip-link">
    Skip to main content
  </a>

  <div class="header-shell">
    <a
      [routerLink]="['/']"
      class="site-logo"
      aria-label="Parks and Recreation Council home"
    >
      <span class="site-logo__badge" aria-hidden="true">
        <i class="pi pi-users text-sm"></i>
      </span>
      <span class="leading-tight">
        <span class="block text-sm font-extrabold tracking-tight">Riverside</span>
        <span class="site-logo__subtitle">
          Recreation Council
        </span>
      </span>
    </a>

    <nav aria-label="Primary" class="primary-nav hidden md:block">
      <ul class="primary-nav__list">
        @for (item of primaryNav; track item.label) {
          <li>
            <a
              [routerLink]="item.commands"
              routerLinkActive="primary-nav__link--active"
              [routerLinkActiveOptions]="{ exact: item.exact ?? false }"
              class="primary-nav__link"
            >
              {{ item.label }}
            </a>
          </li>
        }
      </ul>
    </nav>

    <div class="desktop-actions hidden items-center gap-4 md:flex">
      <a [routerLink]="adminLoginCommands" class="admin-link">
        Admin Login
      </a>

      <p-button label="Register" [routerLink]="registerCommands" size="small" styleClass="register-button"></p-button>
    </div>

    <button
      type="button"
      class="mobile-menu-toggle ml-auto md:hidden"
      aria-label="Open mobile navigation"
      [attr.aria-expanded]="mobileNavOpen()"
      aria-controls="public-mobile-nav-drawer"
      (click)="toggleMobileNav()"
    >
      <i class="pi text-base" [class.pi-bars]="!mobileNavOpen()" [class.pi-times]="mobileNavOpen()" aria-hidden="true"></i>
    </button>
  </div>

  <div class="md:hidden">
    <app-mobile-nav
      [open]="mobileNavOpen()"
      [links]="primaryNav"
      [registerCommands]="registerCommands"
      [adminLoginCommands]="adminLoginCommands"
      (openChange)="updateMobileNavState($event)"
    ></app-mobile-nav>
  </div>
</header>
