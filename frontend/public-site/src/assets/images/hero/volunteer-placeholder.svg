<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Volunteer placeholder image</title>
  <desc id="desc">Abstract illustration representing community volunteers.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="55%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>
    <linearGradient id="card" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#dbeafe" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#dcfce7" stop-opacity="0.9" />
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)" />
  <circle cx="220" cy="190" r="120" fill="#60a5fa" opacity="0.24" />
  <circle cx="1030" cy="150" r="150" fill="#a7f3d0" opacity="0.2" />
  <circle cx="1080" cy="760" r="210" fill="#bfdbfe" opacity="0.2" />

  <rect x="130" y="120" width="940" height="660" rx="28" fill="url(#card)" opacity="0.92" />

  <g fill="#1e3a8a">
