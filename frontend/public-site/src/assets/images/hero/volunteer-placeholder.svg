    <circle cx="600" cy="360" r="64" />
    <circle cx="840" cy="420" r="64" />
  </g>

  <g fill="#2563eb" opacity="0.9">
    <rect x="290" y="500" width="140" height="170" rx="24" />
    <rect x="530" y="440" width="140" height="230" rx="24" />
    <rect x="770" y="500" width="140" height="170" rx="24" />
  </g>

  <g fill="#16a34a" opacity="0.85">
